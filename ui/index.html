<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FanRGB - Lighting Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Vercel Header -->
    <header class="navbar">
      <div class="brand">
        <svg class="brand-triangle" width="16" height="16" viewBox="0 0 76 65" fill="none">
          <path d="M37.5274 0L75.0548 65H0L37.5274 0Z" fill="#ffffff"/>
        </svg>
        <span class="brand-title">FanRGB</span>
      </div>

      <!-- Hardware Status Badges -->
      <div class="status-group">
        <div class="status-indicator" id="mb-indicator">
          <span class="status-dot"></span>
          <span class="status-label">B550 HID</span>
        </div>
        <div class="status-indicator" id="gpu-indicator">
          <span class="status-dot"></span>
          <span class="status-label">RTX 3060 Ti</span>
        </div>
      </div>
    </header>

    <!-- Main Single-Page Controller -->
    <main class="main-content">
      <div class="vercel-card">
        <!-- Effect Mode Selector (Transitions.dev Sliding Tabs) -->
        <div class="section-block">
          <div class="block-header">
            <span class="section-label">Lighting Effect</span>
            <span id="active-effect-pill" class="badge-subtle">MODE: STATIC</span>
          </div>

          <div class="t-tabs" role="tablist">
            <span class="t-tabs-pill" aria-hidden="true"></span>
            <button class="t-tab" role="tab" aria-selected="true" data-mode="static">Static</button>
            <button class="t-tab" role="tab" aria-selected="false" data-mode="breathing">Breathing</button>
            <button class="t-tab" role="tab" aria-selected="false" data-mode="meteor">Meteor</button>
            <button class="t-tab" role="tab" aria-selected="false" data-mode="flashing">Flashing</button>
            <button class="t-tab" role="tab" aria-selected="false" data-mode="off">Power Off</button>
          </div>
        </div>

        <!-- 20 Color Palette Grid -->
        <div class="section-block">
          <div class="block-header">
            <span class="section-label">Select Color (20 Presets)</span>
            <span class="hint-text">Click any color to immediately apply</span>
          </div>

          <div class="color-grid" id="color-grid">
            <!-- 20 Curated Colors -->
            <button class="color-card active" data-name="Pure Red" data-hex="#ff0000" style="--c: #ff0000;">
              <span class="color-swatch"></span>
              <span class="color-name">Pure Red</span>
            </button>
            <button class="color-card" data-name="Crimson" data-hex="#e11d48" style="--c: #e11d48;">
              <span class="color-swatch"></span>
              <span class="color-name">Crimson</span>
            </button>
            <button class="color-card" data-name="Ruby" data-hex="#9f1239" style="--c: #9f1239;">
              <span class="color-swatch"></span>
              <span class="color-name">Ruby</span>
            </button>
            <button class="color-card" data-name="Blood Orange" data-hex="#ea580c" style="--c: #ea580c;">
              <span class="color-swatch"></span>
              <span class="color-name">Blood Orange</span>
            </button>
            <button class="color-card" data-name="Neon Orange" data-hex="#ff7800" style="--c: #ff7800;">
              <span class="color-swatch"></span>
              <span class="color-name">Neon Orange</span>
            </button>

            <button class="color-card" data-name="Amber" data-hex="#f59e0b" style="--c: #f59e0b;">
              <span class="color-swatch"></span>
              <span class="color-name">Amber</span>
            </button>
            <button class="color-card" data-name="Pure Yellow" data-hex="#ffff00" style="--c: #ffff00;">
              <span class="color-swatch"></span>
              <span class="color-name">Yellow</span>
            </button>
            <button class="color-card" data-name="Lime" data-hex="#84cc16" style="--c: #84cc16;">
              <span class="color-swatch"></span>
              <span class="color-name">Lime</span>
            </button>
            <button class="color-card" data-name="Pure Green" data-hex="#00ff00" style="--c: #00ff00;">
              <span class="color-swatch"></span>
              <span class="color-name">Pure Green</span>
            </button>
            <button class="color-card" data-name="Emerald" data-hex="#10b981" style="--c: #10b981;">
              <span class="color-swatch"></span>
              <span class="color-name">Emerald</span>
            </button>

            <button class="color-card" data-name="Teal" data-hex="#14b8a6" style="--c: #14b8a6;">
              <span class="color-swatch"></span>
              <span class="color-name">Teal</span>
            </button>
            <button class="color-card" data-name="Cyan" data-hex="#00ffff" style="--c: #00ffff;">
              <span class="color-swatch"></span>
              <span class="color-name">Cyan</span>
            </button>
            <button class="color-card" data-name="Sky Blue" data-hex="#0ea5e9" style="--c: #0ea5e9;">
              <span class="color-swatch"></span>
              <span class="color-name">Sky Blue</span>
            </button>
            <button class="color-card" data-name="Pure Blue" data-hex="#0000ff" style="--c: #0000ff;">
              <span class="color-swatch"></span>
              <span class="color-name">Pure Blue</span>
            </button>
            <button class="color-card" data-name="Indigo" data-hex="#4338ca" style="--c: #4338ca;">
              <span class="color-swatch"></span>
              <span class="color-name">Indigo</span>
            </button>

            <button class="color-card" data-name="Purple" data-hex="#a855f7" style="--c: #a855f7;">
              <span class="color-swatch"></span>
              <span class="color-name">Purple</span>
            </button>
            <button class="color-card" data-name="Magenta" data-hex="#d946ef" style="--c: #d946ef;">
              <span class="color-swatch"></span>
              <span class="color-name">Magenta</span>
            </button>
            <button class="color-card" data-name="Hot Pink" data-hex="#f43f5e" style="--c: #f43f5e;">
              <span class="color-swatch"></span>
              <span class="color-name">Hot Pink</span>
            </button>
            <button class="color-card" data-name="Pure White" data-hex="#ffffff" style="--c: #ffffff;">
              <span class="color-swatch"></span>
              <span class="color-name">White</span>
            </button>
            <button class="color-card" data-name="Warm White" data-hex="#fff5ea" style="--c: #fff5ea;">
              <span class="color-swatch"></span>
              <span class="color-name">Warm White</span>
            </button>
          </div>
        </div>

        <!-- Custom Color & Live Active State Footer -->
        <div class="active-status-bar">
          <div class="active-info">
            <div id="active-preview-dot" class="preview-glow" style="background: #ff0000;"></div>
            <div class="active-labels">
              <span class="active-title">ACTIVE HARDWARE STATE</span>
              <!-- Transitions.dev Shimmer Text for current state -->
              <span id="active-state-text" class="t-shimmer" data-text="Pure Red · Static">Pure Red · Static</span>
            </div>
          </div>

          <div class="custom-color-control">
            <label for="custom-picker" class="picker-label">Custom:</label>
            <input type="color" id="custom-picker" value="#ff0000" class="mini-picker">
            <input type="text" id="custom-hex" value="#FF0000" maxlength="7" class="mini-hex">
          </div>
        </div>
      </div>
    </main>

    <!-- Transitions.dev Toast Notification -->
    <div id="toast-container" class="t-toast" data-open="false">
      <div class="toast-inner">
        <svg class="toast-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-text">Hardware synced</span>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
